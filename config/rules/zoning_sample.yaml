# How a use table answer maps onto the workflow's levels.
use_outcomes:
  permitted: READY_FOR_EXAMINER
  conditional: HEARING_LIKELY
  not_permitted: CORRECTIONS_LIKELY
  unlisted: INCOMPLETE_SUBMISSION

unlisted_note: >-
  A use that does not appear in the district's table is not automatically refused.
  Most codes have a procedure for deciding whether an unlisted use is similar to a
  listed one, and that decision belongs to the examiner.
