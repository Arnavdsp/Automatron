  MU-1:
    name: Mixed use
    section_prefix: SC-41
    standards:
      min_lot_area_sqft: {value: 5000, section: SC-41.10, comparison: at_least}
      min_lot_width_ft: {value: 50, section: SC-41.11, comparison: at_least}
