name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the service name to confirm a manual deploy
        required: true
        default: automatron

concurrency:
  # One deploy at a time; a queued run is superseded rather than racing.
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  SERVICE: automatron
  REGION: us-central1

jobs:
  # A release only happens on a revision that passed the same checks a pull
  # request gets, so a red build cannot reach the running service.
  checks:
    uses: ./.github/workflows/ci.yml

  # Deployment credentials are set up once, by hand, and until that happens the
  # deploy cannot run. Attempting it anyway failed the auth step on every merge,
  # which trains everyone to expect a red deploy and hides the day it breaks for a
  # real reason. So the run reports that it is not configured and stops there.
  configured:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - id: probe
        env:
          PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          missing=""
          [ -n "$PROVIDER" ] || missing="$missing GCP_WIF_PROVIDER"
          [ -n "$ACCOUNT" ] || missing="$missing GCP_DEPLOY_SERVICE_ACCOUNT"
          [ -n "$PROJECT" ] || missing="$missing GCP_PROJECT_ID"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "deployment credentials are configured"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Deploy skipped: not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing repository secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The README covers the one-time setup. Nothing was deployed, and" \
                 "the checks above still ran." >> "$GITHUB_STEP_SUMMARY"
            echo "deploy skipped; missing:$missing"
          fi

  deploy:
    needs: [checks, configured]
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      # Required for workload identity federation: the job mints a short-lived
      # token instead of holding a service account key.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: authenticate to google cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: deploy to cloud run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --allow-unauthenticated \
            --memory 2Gi --cpu 1 \
            --min-instances 0 --max-instances 1 \
            --concurrency 20 --timeout 900 \
            --session-affinity \
            --set-env-vars LOG_LEVEL=INFO,MAX_PARALLEL_STEPS=2 \
            --set-secrets GROQ_API_KEY=groq-api-key:latest,GROQ_API_KEY_2=groq-api-key-2:latest,GEMINI_API_KEY=gemini-api-key:latest,OPENROUTER_API_KEY=openrouter-api-key:latest,MISTRAL_API_KEY=mistral-api-key:latest,QDRANT_URL=qdrant-url:latest,QDRANT_API_KEY=qdrant-api-key:latest,APP_PASSWORD=app-password:latest

      - name: report the service url
        run: |
          url=$(gcloud run services describe "$SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$REGION" --format='value(status.url)')
          echo "service: $url"
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- service: $SERVICE" >> "$GITHUB_STEP_SUMMARY"
          echo "- region: $REGION" >> "$GITHUB_STEP_SUMMARY"
          echo "- url: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- revision: ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      - name: smoke test the new revision
        run: |
          url=$(gcloud run services describe "$SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$REGION" --format='value(status.url)')
          # Cold start on this image is tens of seconds, so allow for it before
          # calling the deploy bad.
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url/health" || true)
            if [ "$code" = "200" ]; then
              echo "health check passed on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: got '$code', retrying"
            sleep 15
          done
          echo "the new revision never returned a healthy response"
          exit 1
