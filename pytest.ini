[pytest]
testpaths = tests
# Put the repo root on the path so `from tests import testsector` resolves however
# pytest is started. `python -m pytest` adds the working directory and the bare
# `pytest` console script does not, which is why this only ever failed in CI.
pythonpath = .
markers =
    live: needs real provider keys and network access
    slow: takes more than a few seconds
addopts = -m "not live"
asyncio_mode = auto
