global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: automatron
    metrics_path: /metrics
    # /metrics sits behind the operator credential, since it spans every tenant.
    basic_auth:
      username: admin
      password_file: /run/secrets/metrics_password
    static_configs:
      - targets: ["host.docker.internal:7860"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
