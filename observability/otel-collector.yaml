receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}

connectors:
  # Request rate, errors and duration for every span, broken down by what matters
  # here: which graph node, which provider, how the call ended. Lets a dashboard
  # show node latency without the app counting it twice.
  span_metrics:
    histogram:
      explicit:
        buckets: [50ms, 250ms, 1s, 2s, 5s, 10s, 30s, 60s, 120s, 300s]
    dimensions:
      - name: langgraph.node
      - name: gen_ai.system
      - name: automatron.outcome
      - name: automatron.workflow
    exemplars:
      enabled: true

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo, span_metrics]
    metrics:
      receivers: [span_metrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
